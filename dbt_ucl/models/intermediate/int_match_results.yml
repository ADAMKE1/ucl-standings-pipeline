version: 2

models:
  - name: int_match_results
    columns:
      - name: team_id
        data_tests:
          - not_null
      - name: goals_for
        data_tests:
          - not_null
      - name: points
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 3]
                quote: false